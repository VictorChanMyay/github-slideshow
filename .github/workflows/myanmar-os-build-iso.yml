name: Build ISO
on:
  workflow_dispatch:
  push:
    paths: ['myanmar-os/build/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build
        run: sudo apt-get update && sudo apt-get install -y live-build debootstrap
      - name: Build
        working-directory: myanmar-os/build
        run: |
          sudo lb config
          sudo lb build
      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: myanmar-os/build/*.iso
